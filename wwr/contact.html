<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Dave's Rafting Company</title>
    <meta name="description" content="Get in touch with Dave's Rafting Company.Contact us for bookings, inquiries,
      and questions about white water rafting trips and adventures">
    <meta name="author" content="Honu David Kwablah">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <div id="content">
        <header>
            <img src="images/z-raftingbw.png" alt="Dave's Rafting Company Logo">
            <nav>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>

            </nav>

        </header>


        <main>

            <section class="company-info">

                <h1>Dave's Rafting Company</h1>

                <address>
                    3 Trident Close, Akwamufie<br>
                    Near Adomi Bridge, Akosombo<br>
                    Eastern Region, Ghana<br>
                    <a href="tel:+233579986478">+233 57 998 6478</a><br>
                    <a href="mailto:info@davesrafting.com">info@davesrafting.com</a>
                </address>
            </section>

            <div class="contact-layout">
                <div class="map">
                    <!-- Replace this src with the embed code from Google Maps (Share > Embed a map).
                         Remove the style="border:0" that Google adds; the border is set in rafting.css. -->
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15877.2917711425!2d0.0521!3d6.2625!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x10207297282b9575%3A0x6b772c67b2d56a3!2sAkwamufie!5e0!3m2!1sen!2sgh!4v1690000000000!5m2!1sen!2sgh"
                      title="Map showing the location of Dave's Rafting Company" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
                </div>

                <form class="contact-form" action="#" method="post">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com"
                      required>

                    <fieldset>
                        <legend>Message Purpose</legend>
                        <div>
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            <label for="general">General Inquiry</label>
                        </div>
                        <div>
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div>
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </fieldset>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Type here"
                      required></textarea>

                    <div>
                        <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                        <label for="newsletter">Please subscribe me to the monthly
                            newsletter</label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>

            <section class="employees">
                <h2>We Are Here to Serve You</h2>
                <div class="employee-list">
                    <figure>
                        <img src="images/owner-and -lead-generator.jpg"
                          alt="Portrait of  owner and lead guide" width="200">
                        <figcaption>Dave<br>Owner &amp; Lead Guide</figcaption>
                    </figure>

                    <figure>
                        <img src="images/safety-manager.jpg"
                          alt="Portrait of the safety coordinator" width="200">
                        <figcaption>Employee Name<br>Safety Coordinator</figcaption>
                    </figure>

                    <figure>
                        <img src="images/customer-service.jpg"
                          alt="Portrait of the customer service manager" width="200">
                        <figcaption>Employee Name<br>Customer Service Manager</figcaption>
                    </figure>
                </div>
            </section>
        </main>

        <footer>
            <p>©️ 2026 💦 Dave's Rafting Company 💦 Honu David Kwablah!</p>
            <nav class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook-square.svg" alt="Facebook Icon" width="200">
                </a>

                <a href="https://instagram.com">
                    <img src="images/instagram.svg" alt="Instagram Icon" width="200">
                </a>

                <a href="https://tiktok.com">
                    <img src="images/tictok-bw.svg" alt="Tiktok Icon" width="200">
                </a>

            </nav>

        </footer>
    </div>
</body>


</html>
